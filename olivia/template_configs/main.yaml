defaults:
- data: zarr
- dataloader: native_grid
- diagnostics: evaluation
- graph: limited_area # --> we can create the graph in another step: uncomment this and only add minimum needed under 'graph'
- model: graphtransformer
- override hydra/hydra_logging: disabled
- override hydra/job_logging: disabled
- override hydra/launcher: basic
- _self_

config_validation: True

system:
  # Hardware settings
  hardware:
    accelerator: auto
    num_gpus_per_node: 4
    num_nodes: 8
    num_gpus_per_model: 4  # Hybrid: 2 data-parallel replicas, each model sharded across 4 GPUs

  # Input paths
  input:
    dataset: null
    graph: /cluster/projects/nn12017k/graphs/LAM-trimedge-10-res-12-scale12.pt
    truncation: null
    truncation_inv: null
    loss_matrices_path: null
    warm_start: null

  # Output structure
  output:
    root: /cluster/projects/nn12017k/experiments/<replace-me>/
    logs:
      root: logs
      wandb: wandb
      mlflow: mlflow
      tensorboard: tensorboard
    checkpoints:
      root: checkpoint
      every_n_epochs: anemoi-by_epoch-epoch_{epoch:03d}-step_{step:06d}
      every_n_train_steps: anemoi-by_step-epoch_{epoch:03d}-step_{step:06d}
      every_n_minutes: anemoi-by_time-epoch_{epoch:03d}-step_{step:06d}
    plots: plots
    profiler: profiler

data:
  frequency: 3h
  timestep: 3h
  datasets:
    data:
      forcing:
      - h
      - Pair
      - Qair
      - Tair
      - Uwind
      - Vwind
      - cos_julian_day
      - cos_latitude
      - cos_local_time
      - cos_longitude
      - f
      - insolation
      - rain
      - river_binary_mask
      - sin_julian_day
      - sin_latitude
      - sin_local_time
      - sin_longitude
      - sea_mask
      - zeta

      diagnostic: []

      processors:
        imputer:
          _target_: anemoi.models.preprocessing.imputer.InputImputer
          config:
            default: "none"
            mean:
            - salinity_0
            - temperature_0
            - u_eastward_0
            - v_northward_0
            - zeta

        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: "mean-std"
            std: []
            min-max:
            - salinity_0
            max:
            - h
            none:
            - cos_julian_day
            - cos_latitude
            - cos_local_time
            - cos_longitude
            - insolation
            - sin_julian_day
            - sin_latitude
            - sin_local_time
            - sin_longitude
            - river_binary_mask
            - sea_mask
      
dataloader:
  num_workers:
    training: 2
    validation: 2
    test: 2
  batch_size: 
    training: 1 
    validation: 1
    test: 1
  read_group_size: 4

  limit_batches:
    training: null
    validation: null
    test: 20 
  
  dataset:
    join:
      - dataset: /cluster/work/projects/nn12017k/datasets/norkystv3_hindcast_2012-2024.zarr
        frequency: ${data.frequency}
      - dataset: /cluster/work/projects/nn12017k/datasets/forcing_norkystv3_hindcast_2012-2024.zarr
        frequency: ${data.frequency}
    adjust: ["start", "end"]

  grid_indices:
    _target_: anemoi.training.data.grid_indices.MaskedGrid
    nodes_name: data
    node_attribute_name: indices_connected_nodes

  training:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
          drop: ['vbar_northward', 'ubar_eastward', 'Uwind_eastward', 'Vwind_northward']
        start: 2012-01-01
        end: 2022-06-30
        trajectory: ${dataloader.model_run_info}

  validation_rollout: 1 # TODO change later

  validation:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
          drop: ['vbar_northward', 'ubar_eastward', 'Uwind_eastward', 'Vwind_northward']
        start: 2022-07-01
        end: 2023-09-30
        trajectory: ${dataloader.model_run_info}

  test:
    datasets:
      data:
        dataset_config:
          dataset: ${dataloader.dataset}
          frequency: ${data.frequency}
          drop: ['vbar_northward', 'ubar_eastward', 'Uwind_eastward', 'Vwind_northward']
        start: 2023-10-01
        end: 2024-12-31
        trajectory: ${dataloader.model_run_info}

diagnostics:
  plot: 
    callbacks: []
  log:
    mlflow:
      enabled: True
      offline: True
      authentication: True
      tracking_uri: https://mlflow.ecmwf.int
      experiment_name: 'metno-fou'
      run_name: '<replace-me>' #change this
    wandb: 
      enabled: False
      _target_: pytorch_lightning.loggers.wandb.WandbLogger
      offline: False
      log_model: False
      project: 'Anemoi'
      entity: example
      # logger options (these probably come with some overhead)
      gradients: False
      parameters: False
    interval: 100
  print_memory_summary: True
  checkpoint:
    every_n_minutes:
      save_frequency: 60 # Approximate, as this is checked at the end of training steps
      num_models_saved: 1 # If set to k, saves the 'last' k model weights in the training.
  
    every_n_epochs:
      save_frequency: 1
      num_models_saved: -1 # If set to -1, all checkpoints are kept ensuring runs can be continued/forked at any point in the training process
  
    every_n_train_steps:
      save_frequency: 1000 # Does not scale with rollout
      num_models_saved: 2

graph:
  overwrite: False # only create/re-generate the graph with True

model: 
  num_channels: 512 #1024 #TODO: this number dont have to be so large when have few vars, use higher nr when have more layers vars. Test to see if higher than 256 gives added value. Or higher when have less mesh points (remove land)
  keep_batch_sharded: True
  encoder:
    num_chunks: 1
    shard_strategy: "heads"
    graph_attention_backend: "pyg"
  decoder:
    num_chunks: 1
    shard_strategy: "heads"
    graph_attention_backend: "pyg"
  processor:
    graph_attention_backend: "pyg"
  #-------
  trainable_parameters:
    data: 0
    hidden: 0
    data2hidden: 0
    hidden2data: 0
    hidden2hidden: 0 # GNN and GraphTransformer Processor only
  bounding: #These are applied in order
    - _target_: anemoi.models.layers.bounding.ReluBounding
      variables: [] #[salinity_0]
    #- _target_: anemoi.models.layers.bounding.NormalizedReluBounding
    #  variables: [temperature_0]
    #  min_val: [-2]
    #  normalizer: ['mean-std']
  output_mask: # suggested by lam.yaml
    _target_: anemoi.training.utils.masks.Boolean1DMask
    #nodes_name: ${graph.data}
    attribute_name: cutout_mask

# ============================================================================
# TRAINING - adding all from lam.yaml "manually" to turn off tendency scalers
# ============================================================================
training:
  run_id: null
  fork_run_id: null
  transfer_learning: False 
  load_weights_only: False
  update_ds_stats_on_ckpt_load:
    states: False # rebuild state processors from current dataset when loading a checkpoint
    tendencies: True # rebuild tendency processors from current dataset when loading a checkpoint

  deterministic: False

  precision: bf16-mixed # try default: 16-mixed

  #----------------------------
  # Using defaults from lam.yaml
  accum_grad_batches: 1

  num_sanity_val_steps: 6

  # clipp gradients, 0 : don't clip, default algorithm: norm, alternative: value
  gradient_clip:
    val: 32.
    algorithm: value

  # Optimizer settings

  # select model
  training_method: anemoi.training.train.methods.SingleTraining

  # select strategy
  strategy:
    _target_: anemoi.training.distributed.strategy.DDPGroupStrategy
    num_gpus_per_model: ${system.hardware.num_gpus_per_model}
    read_group_size: ${dataloader.read_group_size}

  # loss functions

  # dynamic rescaling of the loss gradient
  # see https://arxiv.org/pdf/2306.06079.pdf, section 4.3.2
  # don't enable this by default until it's been tested and proven beneficial
  loss_gradient_scaling: False

  # loss function for the model
  training_loss:
    datasets:
      data: # user-defined key in data
        # loss class to initialise
        _target_: anemoi.training.losses.MSELoss
        # Scalers to include in loss calculation
        # A selection of available scalers are listed in training/scalers/scalers.yaml
        # '*' is a valid entry to use all `scalers` given, if a scaler is to be excluded
        # add `!scaler_name`, i.e. ['*', '!scaler_1'], and `scaler_1` will not be added.
        scalers: ['general_variable', 'node_weights', 'time_steps']
        ignore_nans: False

  # Validation metrics calculation,
  # This may be a list, in which case all metrics will be calculated
  # and logged according to their name.
  # These metrics are calculated in the output model space, and thus
  # have undergone postprocessing.
  validation_metrics:
    datasets:
      data: # user-defined key in data
        # loss class to initialise
        mse_inside_lam:
          _target_: anemoi.training.losses.MSELoss
          # Scalers to include in loss calculation
          # Cannot scale over the variable dimension due to possible remappings.
          # Available scalers include:
          # - 'loss_weights_mask': Giving imputed NaNs a zero weight in the loss function
          # Use the `scale_validation_metrics` section to variable scale.
          scalers: ["node_weights", "time_steps"]
          # other kwargs
          ignore_nans: True
  #----------------------------

  scalers:
    datasets:
      data: # Same as scalers/lam.yaml, except not adding stdev_tendency and var_tendency
        general_variable:
          _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
          weights:
            default: 1
    
        nan_mask_weights:
          _target_: anemoi.training.losses.scalers.NaNMaskScaler
    
        node_weights:
          _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
          #nodes_name: ${graph.data}
          nodes_attribute_name: area_weight
          norm: "unit-sum"
    
        limited_area_mask:
          _target_: anemoi.training.losses.scalers.GraphNodeAttributeScaler
          #nodes_name: ${graph.data}
          nodes_attribute_name: cutout_mask
          norm: null
        
        time_steps:
          _target_: anemoi.training.losses.scalers.UniformTimeStepScaler

  variable_groups:
    datasets:
      data:
        default: sfc
        # pressure levels removed

  metrics:
    datasets:
      data:
        - 'all' 

  #----------------------------
  # Using defaults from lam.yaml
  submodules_to_freeze: []
  recompile_limit: 32
  #----------------------------
  optimization:
    optimizer:  
      _target_: torch.optim.AdamW
      betas: [0.9, 0.95] # β₁, β₂
    pl_lr_scheduler:
      interval: step
    lr: 14e-4

    lr_scheduler:
      _target_: timm.scheduler.CosineLRScheduler
      lr_min: 3e-7
      t_initial: ${training.max_steps} # NOTE: When max_epochs < max_steps, scheduler will run for max_steps
      warmup_t: 1000
      t_in_epochs: false # t_initial and warmup_t are in steps, not epochs (matches interval: step)

  swa:
    enabled: False
    lr: 3.5e-4
  #weight_averaging: null

  max_epochs: null
  max_steps: 220000

task:
  _target_: anemoi.training.tasks.Forecaster
  multistep_input: 2
  multistep_output: 1
  timestep: "3H"

  # Rollout configuration for autoregressive forecasting
  rollout:
    start: 1
    # increase rollout every n epochs
    epoch_increment: 0
    # maximum rollout to use
    maximum: 1
    # number of rollout steps to use for validation

  validation_rollout: 1 
